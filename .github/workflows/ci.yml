name: TAP quality gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      # Pixel baselines are platform-specific and are reviewed on macOS before
      # release. CI still executes every journey and WCAG assertion on Linux.
      - run: npm run test:e2e -- --ignore-snapshots
